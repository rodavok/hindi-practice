<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hindi Unit 1 Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
/* Layout: one 660px column. Home = lesson list with scores; runner = one question per screen, explanation panel under it, check bar at the bottom. */
:root{
  --paper:#f2f1f5; --card:#ffffff; --ink:#24212b; --muted:#625e6d; --line:#dad7e2;
  --accent:#7a4fd6; --btn:#5a35b5; --btn-ink:#ffffff;
  --good:#1c7f45; --good-bg:#e3f4ea; --bad:#b93232; --bad-bg:#fbe6e6;
  --al-s:78%; --al-l:87%;
  --display:"Tiro Devanagari Hindi","Mukta","Noto Sans Devanagari",serif;
  --body:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#18171c; --card:#222028; --ink:#eceaf2; --muted:#a6a2b2; --line:#393642;
    --accent:#a88cf2; --btn:#a88cf2; --btn-ink:#1b1233;
    --good:#58cf8c; --good-bg:#143524; --bad:#ff8585; --bad-bg:#3d1a22;
    --al-s:45%; --al-l:30%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#18171c; --card:#222028; --ink:#eceaf2; --muted:#a6a2b2; --line:#393642;
  --accent:#a88cf2; --btn:#a88cf2; --btn-ink:#1b1233;
  --good:#58cf8c; --good-bg:#143524; --bad:#ff8585; --bad-bg:#3d1a22;
  --al-s:45%; --al-l:30%;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:660px;margin:0 auto;padding:20px 16px 130px;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:28px;line-height:1.15;margin:0;text-wrap:balance}
h1 .hi{font-family:var(--display);font-weight:400;display:block;font-size:22px;color:var(--muted);margin-top:4px}
h2{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:5px 14px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.levelrow{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.note{font-size:14px;color:var(--muted);margin:0}
.warn{border-left:4px solid var(--accent);background:var(--card);padding:10px 12px;font-size:14px;border-radius:4px}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 18px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.skill{display:flex;flex-direction:column;gap:4px;font-size:14px}
.skill span{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.lessons{display:flex;flex-direction:column;gap:8px}
.lesson{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
.lesson:hover{border-color:var(--accent)}
.lesson[disabled]{opacity:.55;cursor:not-allowed}
.lesson .n{font-family:var(--display);font-size:22px;color:var(--muted);text-align:center}
.lesson b{display:block;font-weight:600}
.lesson small{color:var(--muted);font-size:14px}
.lesson.test{border-width:2px;border-color:var(--accent)}
.score{font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--paper);white-space:nowrap}
.score.ok{background:var(--good-bg);color:var(--good)}
/* runner */
.runhead{display:flex;align-items:center;gap:12px}
.runhead .bar{flex:1;height:10px;border-radius:5px}
.x{border:0;background:none;font-size:15px;color:var(--muted);padding:4px 6px;text-decoration:underline}
.count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.q{font-size:18px;font-weight:600;margin:0;text-wrap:balance}
.prompt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;gap:14px;align-items:center}
.prompt .txt{flex:1;min-width:0}
.big{font-family:var(--display);font-size:32px;line-height:1.35;overflow-wrap:anywhere}
.tr{font-style:italic;color:var(--muted);font-size:15px;overflow-wrap:anywhere}
body.notr .tr{display:none}
.spk{flex:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center}
.spk svg{width:22px;height:22px;fill:var(--ink)}
.spk.big-spk{width:76px;height:76px;background:var(--btn);border-color:var(--btn)}
.spk.big-spk svg{width:34px;height:34px;fill:var(--btn-ink)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:460px){.opts{grid-template-columns:1fr}.big{font-size:27px}}
.opt{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;display:flex;gap:10px;align-items:baseline;min-height:58px}
.opt kbd{font:600 12px var(--body);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.hi{font-family:var(--display)}
.opt .hi{font-size:23px;line-height:1.3}
.opt.sel{border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.slot{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:6px 0;align-items:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:60px}
.tile{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:10px;padding:5px 12px;text-align:center}
.tile .hi{font-size:22px;display:block;line-height:1.3}
.tile .tr{font-size:13px}
.tile.used{visibility:hidden}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.match .opt{justify-content:center;text-align:center}
.match .opt.done{opacity:.4;border-color:var(--good)}
/* explanation panel */
.detail{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.detail h3{margin:0;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.detail p{margin:0}
.align{display:flex;flex-direction:column;gap:8px}
.align .line{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}
.tok{display:inline-flex;flex-direction:column;align-items:center;padding:2px 8px;border-radius:6px;border:1px dashed var(--line)}
.tok .hi{font-size:23px;line-height:1.3}
.tok .tr{font-size:13px}
.al{background:hsl(var(--h) var(--al-s) var(--al-l));border-radius:6px;padding:1px 6px}
.tok.al{border:1px solid transparent;padding:2px 8px}
.al0{--h:268}.al1{--h:198}.al2{--h:150}.al3{--h:42}.al4{--h:340}.al5{--h:92}.al6{--h:18}
.enline{font-size:19px;line-height:1.9}
.ai{white-space:pre-wrap;font-size:15px;border-left:3px solid var(--accent);padding-left:10px}
.ai:empty{display:none}
.askbtn{align-self:flex-start;border:1px solid var(--accent);color:var(--accent);background:none;border-radius:8px;padding:6px 12px;font-size:15px;font-weight:600}
.askbtn:disabled{opacity:.5;cursor:default}
.cmp{display:flex;flex-direction:column;gap:2px;margin:6px 0}
.cmp .yours{color:var(--bad)} .cmp .right{color:var(--good)}
.cmp b{font-weight:600;color:var(--ink);font-size:13px;text-transform:uppercase;letter-spacing:.05em;margin-right:6px}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px}
.foot .in{max-width:660px;margin:0 auto;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.foot.good{background:var(--good-bg)} .foot.bad{background:var(--bad-bg)}
.fb{flex:1;min-width:200px;font-size:15px}
.fb strong{display:block;font-size:17px}
.foot.good .fb strong{color:var(--good)} .foot.bad .fb strong{color:var(--bad)}
.fb .hi{font-size:20px}
.go{background:var(--btn);color:var(--btn-ink);border:0;border-radius:10px;padding:12px 26px;font-weight:700;font-size:17px}
.go:disabled{opacity:.4;cursor:not-allowed}
.go.alt{background:none;color:var(--ink);border:2px solid var(--line)}
.result{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:6px}
.result .pct{font-size:54px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.missed{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.missed li{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:6px;padding:10px 12px;font-size:15px;display:flex;flex-direction:column;gap:4px}
.missed .hi{font-size:19px}
.row{display:flex;gap:10px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="foot" id="foot" hidden><div class="in"><div class="fb" id="fb"></div><div class="row" id="footbtns"></div></div></div>

<script>
"use strict";
/* ============================================================
   CONTENT. Everything below COURSE is generic; a new unit only
   needs a new entry shaped like this one.
   English sentences carry alignment marks: word[i] ties that English
   word to Hindi word number i (0-based, punctuation not counted);
   {two words}[i] ties a phrase; word[i+j] ties one English word to
   two Hindi words. Unmarked words have no counterpart.
   ============================================================ */
const COURSE = {
  id: "unit1",
  title: "Unit 1 practice",
  titleHi: "मैं · तुम · आप",
  scope: "Pronouns, the verb “to be”, yes/no questions, noun plurals, adjective agreement",
  // c: n = noun, a = adjective, p = pronoun, x = other. g: m/f for nouns.
  vocab: [
    ["नमस्ते","hello","x"],["शुक्रिया","thank you","x"],["जी हाँ","yes","x"],["जी नहीं","no","x"],
    ["मैं","I","p"],["हम","we","p"],["तुम","you (familiar)","p"],["आप","you (formal)","p"],["यह","this","p"],["वह","that","p"],
    ["लड़का","boy","n","m"],["लड़की","girl","n","f"],["आदमी","man","n","m"],["लोग","people","n","m"],["बच्चा","child","n","m"],
    ["दादी","grandmother","n","f"],["पिता","father","n","m"],["माता","mother","n","f"],
    ["कमरा","room","n","m"],["मकान","house","n","m"],["बग़ीचा","garden","n","m"],["गाड़ी","car","n","f"],["साइकिल","bicycle","n","f"],
    ["अलमारी","cupboard","n","f"],["मेज़","table","n","f"],["कुरसी","chair","n","f"],["पंखा","fan","n","m"],["खिड़की","window","n","f"],
    ["पलंग","bed","n","m"],["पत्थर","stone","n","m"],["चिड़िया","bird","n","f"],
    ["बड़ा","big","a"],["छोटा","small","a"],["अच्छा","good","a"],["पुराना","old (of things)","a"],["बूढ़ा","elderly","a"],["दूसरा","other","a"],
    ["ख़ाली","empty","a"],["साफ़","clean","a"],["सुन्दर","beautiful","a"],["लाल","red","a"],["सफ़ेद","white","a"],["हवादार","airy","a"],["ठीक","all right","a"],
    ["बहुत","very","x"],["काफ़ी","quite","x"],["सिर्फ़","only","x"],["दोनों","both","x"],["और","and","x"],["लेकिन","but","x"],["यहाँ","here","x"],
    ["एक","one","x"],["दो","two","x"],["तीन","three","x"],["ज़रूर","of course","x"]
  ],
  be: [
    ["मैं अमरीकन ___ ।","हूँ","I[0] am[2] American[1].","मैं always takes हूँ."],
    ["तुम ठीक ___ ?","हो","Are[2] you[0] OK[1]?","तुम takes हो."],
    ["यह कमरा साफ़ ___ ।","है","This[0] room[1] is[3] clean[2].","The subject is one thing, so it takes है."],
    ["हम पंजाबी ___ ।","हैं","We[0] are[2] Panjabi[1].","हम takes हैं."],
    ["क्या आप जर्मन ___ ?","हैं","Are[3] you[1] German[2]?","आप is grammatically plural, so it takes हैं."],
    ["वे लड़के रूसी ___ ।","हैं","Those[0] boys[1] are[3] Russian[2].","The subject is plural, so it takes हैं."],
    ["तू अच्छी लड़की ___ ।","है","You[0] are[3] a good[1] girl[2].","तू takes है, like यह and वह."],
    ["दोनों कुरसियाँ पुरानी ___ ।","हैं","Both[0] chairs[1] are[3] old[2].","The subject is plural, so it takes हैं."],
    ["वह गाड़ी सफ़ेद ___ ।","है","That[0] car[1] is[3] white[2].","The subject is one thing, so it takes है."],
    ["क्या तुम दोनों गुजराती ___ ?","हो","Are[4] you[1] two[2] Gujarati[3]?","The subject is still तुम, so it takes हो."],
    ["दादी जी बहुत अच्छी ___ ।","हैं","Grandmother[0] is[4] very[2] nice[3].","Respect for a person is shown with the plural verb, हैं."],
    ["मैं रूसी नहीं ___ ।","हूँ","I[0] am[3] not[2] Russian[1].","मैं always takes हूँ."]
  ],
  plural: [
    ["लड़का","boy","m",["लड़के","लड़काएँ","लड़कियाँ","लड़का"],"Masculine nouns ending in -ā change it to -e."],
    ["कमरा","room","m",["कमरे","कमरा","कमराएँ","कमरें"],"Masculine nouns ending in -ā change it to -e."],
    ["मकान","house","m",["मकान","मकाने","मकानें","मकानियाँ"],"Masculine nouns that do not end in -ā stay the same in the plural."],
    ["आदमी","man","m",["आदमी","आदमियाँ","आदमे","आदमीएँ"],"Masculine nouns that do not end in -ā stay the same in the plural."],
    ["लड़की","girl","f",["लड़कियाँ","लड़कीएँ","लड़के","लड़की"],"Feminine nouns ending in -ī change it to -iyā̃."],
    ["मेज़","table","f",["मेज़ें","मेज़","मेज़े","मेज़ियाँ"],"Feminine nouns that do not end in -ī add -ẽ."],
    ["कुरसी","chair","f",["कुरसियाँ","कुरसीएँ","कुरसे","कुरसी"],"Feminine nouns ending in -ī change it to -iyā̃."],
    ["पंखा","fan","m",["पंखे","पंखाएँ","पंखियाँ","पंखा"],"Masculine nouns ending in -ā change it to -e."],
    ["माता","mother","f",["माताएँ","माते","मातियाँ","माता"],"Feminine nouns that do not end in -ī add -ẽ, even when they end in -ā."],
    ["पिता","father","m",["पिता","पिते","पिताएँ","पितियाँ"],"A few masculine relationship words ending in -ā never change."],
    ["चिड़िया","bird","f",["चिड़ियाँ","चिड़ियाएँ","चिड़िये","चिड़िया"],"Feminine nouns ending in -iyā change it to -iyā̃."],
    ["साइकिल","bicycle","f",["साइकिलें","साइकिल","साइकिलियाँ","साइकिले"],"Feminine nouns that do not end in -ī add -ẽ."]
  ],
  adj: [
    ["___ कमरा","big[0] room[1]",["बड़ा","बड़े","बड़ी"],"कमरा is masculine singular."],
    ["___ लड़कियाँ","small[0] girls[1]",["छोटी","छोटा","छोटे"],"लड़कियाँ is feminine plural."],
    ["___ कमरे","other[0] rooms[1]",["दूसरे","दूसरा","दूसरी"],"कमरे is masculine plural."],
    ["___ मेज़","old[0] table[1]",["पुरानी","पुराना","पुराने"],"मेज़ is feminine singular."],
    ["___ साइकिलें","old[0] bicycles[1]",["पुरानी","पुराने","पुराना"],"साइकिलें is feminine plural."],
    ["___ लड़के","good[0] boys[1]",["अच्छे","अच्छा","अच्छी"],"लड़के is masculine plural."],
    ["दो ___ मकान","two[0] big[1] houses[2]",["बड़े","बड़ा","बड़ी"],"मकान is masculine, and with दो it is plural."],
    ["___ कुरसियाँ","red[0] chairs[1]",["लाल","लाली","लाले","लाला"],"लाल never changes.",true],
    ["___ कमरे","empty[0] rooms[1]",["ख़ाली","ख़ाले","ख़ाला"],"ख़ाली never changes.",true],
    ["एक ___ आदमी","an[0] elderly[1] man[2]",["बूढ़ा","बूढ़ी","बूढ़े"],"आदमी is masculine singular here."],
    ["___ दादी","elderly[0] grandmother[1]",["बूढ़ी","बूढ़ा","बूढ़े"],"दादी is feminine singular."],
    ["___ गाड़ी","white[0] car[1]",["सफ़ेद","सफ़ेदी","सफ़ेदा","सफ़ेदे"],"सफ़ेद never changes.",true]
  ],
  tiles: [
    ["This[0] room[1] is[3] big[2].",["यह","कमरा","बड़ा","है"],["बड़ी","हैं"]],
    ["This[0] is[3] a big[1] room[2].",["यह","बड़ा","कमरा","है"],["बड़े","हो"]],
    ["Are[3] you[1] Indian[2]? (formal)",["क्या","आप","हिन्दुस्तानी","हैं"],["हो","तुम"]],
    ["I[0] am[3] not[2] English[1].",["मैं","अँग्रेज़","नहीं","हूँ"],["है","हम"]],
    ["Both[0] cupboards[1] are[3] empty[2].",["दोनों","अलमारियाँ","ख़ाली","हैं"],["अलमारी","है"]],
    ["That[0] car[1] is[4] not[3] Japanese[2].",["वह","गाड़ी","जापानी","नहीं","है"],["हैं","यहाँ"]],
    ["{There are}[3] two[1] chairs[2] here[0].",["यहाँ","दो","कुरसियाँ","हैं"],["कुरसी","है"]],
    ["The window[0] is[3] quite[1] big[2].",["खिड़की","काफ़ी","बड़ी","है"],["बड़ा","बहुत"]],
    ["We[0] are[2] Panjabi[1] but[3] they[4] are[6] Gujarati[5].",["हम","पंजाबी","हैं","लेकिन","वे","गुजराती","हैं"],["हो","और"]],
    ["The garden[0] is[3] very[1] beautiful[2].",["बग़ीचा","बहुत","सुन्दर","है"],["हैं","काफ़ी"]]
  ],
  usage: [
    ["You meet a friend's grandmother for the first time. Which “you” do you use?",null,["आप","तुम","तू"],"आप is the respectful default. तुम is for friends and people who expect no formality; तू is only for intimates and small children."],

function explain(it, chosen){
  if (it.t === "match") return "";
  if (it.t === "tiles") return explainTiles(it, chosen);
  if (it.kind === "vocab"){
    const c = V.find(x => x.hi === chosen || x.en === chosen), w = V.find(x => x.hi === it.word);
    return c && w ? `${c.hi} (${tr(c.hi)}) means “${c.en}”. ${w.hi} (${tr(w.hi)}) means “${w.en}”.` : "";
  }
  if (it.skill === "be") return `${chosen} ${BE[chosen]}. ${it.why}`;
  if (it.skill === "plural"){
    let lead;
    if (chosen === it.hi) lead = `${chosen} is the singular left as it is, but this noun does change in the plural.`;
    else if (/ियाँ$/.test(chosen)) lead = `The ending -iyā̃ belongs to feminine nouns that end in -ī or -iyā.`;
    else if (/(ें|एँ)$/.test(chosen)) lead = `The ending -ẽ belongs to feminine nouns that do not end in -ī.`;
    else if (/े$/.test(chosen)) lead = `The ending -e is how masculine nouns in -ā form their plural.`;
    else lead = `${chosen} is not a form this noun takes.`;
    return `${lead} ${it.hi} is ${it.g === "m" ? "masculine" : "feminine"}. ${it.why}`;
  }
  if (it.skill === "adj"){
    if (it.inv) return `${chosen} is not a real form. ${it.why} Only adjectives ending in -ā change to match the noun.`;
    const lead = /ी$/.test(chosen) ? "The -ī form goes with feminine nouns, singular or plural." : /े$/.test(chosen) ? "The -e form goes with masculine plural nouns." : "The -ā form goes with a masculine singular noun.";
    return `${lead} ${it.why} So it needs ${it.a}.`;
  }
  return it.why || "";
}
function explainTiles(it, got){
  const ans = it.ans, key = a => a.slice().sort().join(" ");
  if (key(ans) === key(got)) return "You picked the right words but in the wrong order. Hindi puts the subject first and the verb last, with नहीं just before the verb. An adjective placed before a noun belongs to it (“a big room”); placed after it, the adjective is what the sentence says about the noun (“the room is big”).";
  let missing = ans.filter(w => !got.includes(w));
  const parts = [];
  got.filter(w => !ans.includes(w)).forEach(w => {
    const m = missing.find(x => BE[w] && BE[x]) || missing.find(x => x.slice(0, 2) === w.slice(0, 2));
    if (m && BE[w]) parts.push(`You used ${w}, which ${BE[w]}. This sentence needs ${m}.`);
    else if (m) parts.push(`You used ${w} where ${m} is needed. The form has to match the gender and number of the noun.`);
    else { const v = V.find(x => x.hi === w); parts.push(`${w}${v ? ` (“${v.en}”)` : ""} does not belong in this sentence.`); }
    if (m) missing = missing.filter(x => x !== m);
  });
  if (missing.length) parts.push(`You left out ${missing.join(", ")}.`);
  if (got.length !== ans.length && !parts.length) parts.push("The sentence has the wrong number of words.");
  return parts.join(" ");
}

  const notes = [...new Set(toks.filter((w, i) => !(i in col) && GLOSS[w]))].map(w => `${w} ${GLOSS[w]}.`).join(" ");

  <div class="levelrow">
    <div class="seg" role="group" aria-label="Difficulty">${LEVELS.map((l, i) => `<button data-lv="${i}" aria-pressed="${i === state.level}">${l.name}</button>`).join("")}</div>
    <span class="note">${lv.opts} choices per word, ${lv.pairs} pairs to match, ${lv.extra} extra ${lv.extra === 1 ? "tile" : "tiles"} in sentence building.</span>
  </div>
  ${hasAudio() ? "" : `<div class="warn">No Hindi voice is available here, so words will not be read aloud and the listening lesson is off. Opening this page in Google Chrome usually fixes that.</div>`}
  ${sk.length ? `<h2>Strengths and gaps</h2><div class="skills">${sk.map(k => { const s = state.skills[k], p = Math.round(100 * s.c / s.n); return `<div class="skill"><span><b>${SKILLS[k]}</b><em>${p}% of ${s.n}</em></span><div class="bar"><i style="width:${p}%"></i></div></div>`; }).join("")}</div>` : ""}
  <h2>Lessons</h2>
  <div class="lessons">
    ${LESSONS.map((l, i) => { const b = state.best[l.id]; const off = l.needsAudio && !hasAudio();
      return `<button class="lesson${l.test ? " test" : ""}" data-l="${l.id}" ${off ? "disabled" : ""}><span class="n">${l.test ? "★" : i + 1}</span><span><b>${esc(l.title)}</b><small>${esc(l.desc)} · ${l.n} ${l.unit || "questions"}</small></span>${b == null ? `<span class="score">New</span>` : `<span class="score${b >= 80 ? " ok" : ""}">Best ${b}%</span>`}</button>`; }).join("")}
    ${missed.length ? `<button class="lesson" data-l="mistakes"><span class="n">↺</span><span><b>Practise your mistakes</b><small>Questions you got wrong last time</small></span><span class="score">${missed.length} left</span></button>` : ""}
  </div>
  <p class="note">Scores are kept in this browser only. Keys: 1 to 6 choose, Enter checks.</p>`;
  document.getElementById("trbtn").onclick = () => { state.translit = !state.translit; save(); home(); };
  app.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => { state.level = +b.dataset.lv; save(); home(); });
  app.querySelectorAll("[data-l]").forEach(b => b.onclick = () => start(b.dataset.l));
}

function start(id){
  let items, lesson;
  if (id === "mistakes"){ lesson = {id, title:"Practise your mistakes"}; items = shuffle(Object.keys(state.missed).map(itemById).filter(Boolean)).slice(0, 15); }
  else { lesson = LESSONS.find(l => l.id === id); items = lesson.make(); }
  if (!items.length) return home();
  run = {lesson, items, i:0, right:0, wrong:[]};
  view = "run"; show();
}

function show(){
  const it = run.items[run.i]; run.sel = null; run.done = false;
  const head = `<div class="runhead"><button class="x" id="quit">Quit</button><div class="bar"><i style="width:${100 * run.i / run.items.length}%"></i></div><span class="count">${run.i + 1} / ${run.items.length}</span></div><p class="q">${esc(it.q)}</p>`;
  let body = "";
  if (it.t === "mc" || it.t === "listen"){
    it._opts = shuffle(it.opts);
    if (it.t === "listen") body += `<div class="prompt" style="justify-content:center"><button class="spk big-spk" id="spk" aria-label="Play the word again">${SPK}</button></div>`;
    else if (it.hi) body += `<div class="prompt"><div class="txt"><div class="big" lang="hi">${esc(it.hi)}</div><div class="tr">${esc(tr(it.hi))}</div></div>${it.audio && hasAudio() ? `<button class="spk" id="spk" aria-label="Hear it">${SPK}</button>` : ""}</div>`;
    body += `<div class="opts">${it._opts.map((o, k) => `<button class="opt" data-k="${k}"><kbd>${k + 1}</kbd>${isHi(o) ? hiHTML(o) : `<span>${esc(o)}</span>`}</button>`).join("")}</div>`;
  } else if (it.t === "tiles"){
    const n = L().extra, more = n > it.extra.length ? sample(TILEPOOL.filter(w => !it.ans.includes(w) && !it.extra.includes(w)), n - it.extra.length) : [];
    it._bank = shuffle([...it.ans, ...it.extra.slice(0, n), ...more]).map((w, k) => ({w, k})); run.sel = [];
    body += `<div class="prompt"><div class="txt"><div style="font-size:22px;font-weight:600">${esc(plainEn(it.en))}</div></div></div><div class="slot" id="slot" aria-label="Your sentence"></div><div class="bank" id="bank"></div>`;
  } else if (it.t === "match"){
    run.m = {left:null, done:0, errs:0};
    const A = shuffle(it.pairs.map(p => p[0])), B = shuffle(it.pairs.map(p => p[1]));
    body += `<div class="match">${A.map((h, k) => `<button class="opt" data-side="l" data-v="${esc(h)}">${hiHTML(h)}</button><button class="opt" data-side="r" data-v="${esc(B[k])}"><span>${esc(B[k])}</span></button>`).join("")}</div>`;
  }
  app.innerHTML = head + body;
  document.getElementById("quit").onclick = home;
  const spk = document.getElementById("spk");
  if (spk) spk.onclick = () => speak(it.sayNow || it.hi);
  if (it.t === "listen") speak(it.sayNow);
  if (it.t === "mc" || it.t === "listen") app.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.k));
  if (it.t === "tiles") drawTiles();
  if (it.t === "match") app.querySelectorAll(".match .opt").forEach(b => b.onclick = () => matchClick(b));
  foot.hidden = it.t === "match"; foot.className = "foot";
  fb.innerHTML = "";
  footbtns.innerHTML = `<button class="go" id="go" disabled>Check</button>`;
  document.getElementById("go").onclick = check;
  window.scrollTo(0, 0);
}

function pick(k){
  if (run.done) return;
  run.sel = k;
  app.querySelectorAll(".opts .opt").forEach(b => b.classList.toggle("sel", +b.dataset.k === k));
  document.getElementById("go").disabled = false;
}
function drawTiles(){
  const it = run.items[run.i];
  const tile = (o, used) => `<button class="tile${used ? " used" : ""}" data-k="${o.k}" ${used || run.done ? "disabled" : ""}><span class="hi" lang="hi">${esc(o.w)}</span><span class="tr">${esc(TR[o.w] || "")}</span></button>`;
  document.getElementById("slot").innerHTML = run.sel.map(k => tile(it._bank.find(o => o.k === k))).join("");
  document.getElementById("bank").innerHTML = it._bank.map(o => tile(o, run.sel.includes(o.k))).join("");
  document.querySelectorAll("#bank .tile").forEach(b => b.onclick = () => { run.sel.push(+b.dataset.k); speak(it._bank.find(o => o.k === +b.dataset.k).w); drawTiles(); });
  document.querySelectorAll("#slot .tile").forEach(b => b.onclick = () => { run.sel = run.sel.filter(k => k !== +b.dataset.k); drawTiles(); });
  const go = document.getElementById("go"); if (go && !run.done) go.disabled = !run.sel.length;
}
function matchClick(b){
  const it = run.items[run.i], m = run.m;
  if (b.classList.contains("done")) return;
  if (b.dataset.side === "l"){ app.querySelectorAll('.match [data-side="l"]').forEach(x => x.classList.remove("sel")); b.classList.add("sel"); m.left = b; speak(b.dataset.v); return; }
  if (!m.left) return;
  const ok = it.pairs.some(p => p[0] === m.left.dataset.v && p[1] === b.dataset.v);
  if (ok){ [m.left, b].forEach(x => { x.classList.remove("sel"); x.classList.add("done"); x.disabled = true; }); m.left = null; m.done++;
    if (m.done === it.pairs.length) finish(m.errs === 0, null);
  } else { m.errs++; b.classList.add("wrong"); setTimeout(() => b.classList.remove("wrong"), 500); }
}

function check(){
  const it = run.items[run.i];
  if (run.done) return next();
  if (it.t === "mc" || it.t === "listen"){
    if (run.sel == null) return;
    const chosen = it._opts[run.sel];
    app.querySelectorAll(".opts .opt").forEach(b => { const o = it._opts[+b.dataset.k]; b.disabled = true; if (o === it.a) b.classList.add("right"); else if (+b.dataset.k === run.sel) b.classList.add("wrong"); });
    if (it.say) speak(it.say);
    finish(chosen === it.a, chosen);
  } else if (it.t === "tiles"){
    const got = run.sel.map(k => it._bank.find(o => o.k === k).w);
    const ok = [it.ans, ...it.alt].some(a => a.join(" ") === got.join(" "));
    speak(it.ans.join(" "));
    finish(ok, got);
    drawTiles();
  }
}
function finish(ok, chosen){
  const it = run.items[run.i]; run.done = true;
  const why = ok ? "" : it.t === "match" ? `${run.m.errs} wrong ${run.m.errs === 1 ? "try" : "tries"} this round.` : explain(it, chosen);
  if (ok) run.right++; else run.wrong.push({it, chosen, why});
  const s = state.skills[it.skill] || (state.skills[it.skill] = {c:0, n:0}); s.n++; if (ok) s.c++;
  if (!it.nosave){ if (ok) delete state.missed[it.id]; else state.missed[it.id] = 1; }
  save();
  const right = it.t === "tiles" ? it.ans.join(" ") : it.a;
  foot.hidden = false; foot.className = "foot " + (ok ? "good" : "bad");
  fb.innerHTML = `<strong>${ok ? "Correct" : "Not quite"}</strong>${!ok && right ? `Right answer: ${show1(right)}` : ""}${it.reveal ? ` The word was ${hiHTML(it.reveal)}.` : ""}${it.t === "match" && !ok ? esc(why) : ""}`;
  const al = alignFor(it);
  if (it.t !== "match" && (al || !ok)){
    const d = document.createElement("div"); d.className = "detail";
    d.innerHTML = `${!ok && why ? `<h3>Why</h3><p>${esc(why)}</p>` : ""}${al ? `<h3>Word by word</h3>${al}` : ""}${!ok ? askHTML() : ""}`;
    if (d.innerHTML){ app.appendChild(d); wireAsk(d, it, chosen); }
  }
  footbtns.innerHTML = `<button class="go" id="go">${run.i + 1 === run.items.length ? "See results" : "Continue"}</button>`;
  const go = document.getElementById("go"); go.onclick = next; go.focus({preventScroll:true});
}
function next(){ run.i++; if (run.i >= run.items.length) results(); else show(); }

function results(){
  view = "results"; foot.hidden = true;
  const n = run.items.length, pct = Math.round(100 * run.right / n), l = run.lesson;
  if (l.id !== "mistakes") state.best[l.id] = Math.max(state.best[l.id] || 0, pct);
  save();
  const verdict = l.test ? (pct >= 80 ? "Passed. You are ready for the next unit." : "Not yet. Work through the missed items below, then try again.") : pct === 100 ? "Clean run." : pct >= 80 ? "Solid. A few to review." : "Worth another pass.";
  const by = {}; run.wrong.forEach(w => by[w.it.skill] = (by[w.it.skill] || 0) + 1);
  const weak = Object.keys(by).sort((a, b) => by[b] - by[a]).map(k => `${SKILLS[k]} (${by[k]})`).join(", ");
  const row = ({it, chosen, why}) => {
    if (it.t === "match") return `<li>Match round: ${it.pairs.map(p => `${hiHTML(p[0])} = ${esc(p[1])}`).join(", ")}<span class="note">${esc(why)}</span></li>`;
    const mine = it.t === "tiles" ? chosen.join(" ") : chosen, right = it.t === "tiles" ? it.ans.join(" ") : it.a;
    return `<li><span>${esc(it.t === "tiles" ? plainEn(it.en) : it.q)}${it.hi ? ` ${hiHTML(it.hi)}` : ""}${it.reveal ? ` ${hiHTML(it.reveal)}` : ""}</span>
      <div class="cmp"><span class="yours"><b>You chose</b>${show1(mine)}</span><span class="right"><b>Right answer</b>${show1(right)}</span></div>
      ${why ? `<span>${esc(why)}</span>` : ""}${askHTML()}</li>`;
  };
  app.innerHTML = `
  <h2>${esc(l.title)}</h2>
  <div class="result"><div class="pct">${pct}%</div><div>${run.right} of ${n} correct. ${verdict}</div>${weak ? `<div class="note">Missed by area: ${esc(weak)}</div>` : ""}</div>
  <div class="row">${run.wrong.some(w => !w.it.nosave) ? `<button class="go" id="again">Retry the ones I missed</button>` : ""}<button class="go alt" id="back">Back to lessons</button></div>
  ${run.wrong.length ? `<h2>Review</h2><ul class="missed">${run.wrong.map(row).join("")}</ul>` : ""}`;
  app.querySelectorAll(".missed li").forEach((li, i) => wireAsk(li, run.wrong[i].it, run.wrong[i].chosen));
  document.getElementById("back").onclick = home;
  const again = document.getElementById("again");
  if (again) again.onclick = () => { const items = shuffle(run.wrong.map(w => w.it).filter(it => !it.nosave)); run = {lesson:{id:"mistakes", title:"Retry"}, items, i:0, right:0, wrong:[]}; view = "run"; show(); };
  window.scrollTo(0, 0);
}

document.addEventListener("keydown", e => {
  if (view !== "run" || !run) return;
  const it = run.items[run.i];
  if (/^[1-6]$/.test(e.key) && (it.t === "mc" || it.t === "listen") && !run.done && +e.key <= it._opts.length){ pick(+e.key - 1); e.preventDefault(); }
  else if (e.key === "Enter"){ const go = document.getElementById("go"); if (go && !go.disabled && document.activeElement !== go){ go.click(); e.preventDefault(); } }
});

if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
home();
/* Optional page capabilities: light up when (and if) they resolve. */
if (window.claude && typeof window.claude.use === "function"){
  window.claude.use("sample").then(s => { askClaude = s || null; }).catch(() => {});
  window.claude.use("tts").then(t => { cloudTTS = t || null; if (view === "home") home(); }).catch(() => {});
}
</script>
</body>
</html>
